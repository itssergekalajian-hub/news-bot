name: News Bot Run

on:
  schedule:
    # Every 30 minutes. NOTE: this repo is PRIVATE, so GitHub Actions minutes
    # are metered (~2000/month on the Free plan, and each run uses ~3 min).
    # A much faster cadence (e.g. every 5 min = ~26,000 min/month) would blow
    # the monthly budget in a couple of days and then halt ALL runs until the
    # quota resets - do NOT tighten this interval without either making the
    # repo public (public repos get unlimited Actions minutes) or accounting
    # for the minute budget. GitHub's scheduler is also best-effort, not
    # exact - on a metered private repo it drops/delays many scheduled runs,
    # so actual runs can be 1-3 hours apart even at this interval.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Prevent overlapping runs if one takes longer than 5 minutes
concurrency:
  group: news-bot-run
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit the updated dedup DB back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python main.py

      - name: Commit updated dedup database
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted_stories.db
          git diff --cached --quiet && echo "No DB changes to commit" || git commit -m "Update dedup DB [skip ci]"
          git push
